# Include inside the TLS server; root must be the website directory.
autoindex off;
server_tokens off;
client_max_body_size 6m;
client_body_timeout 15s;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;

# These regex locations precede every general static-file rule.
location ~* (^|/)\. { return 404; }
location ~* ^/(app|vendor|writable|tests|tools|build|deploy)(/|$) { return 404; }
location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|phpunit[^/]*|spark|preload\.php|env|.*\.(sql|bak|log|ini|ya?ml))$ { return 404; }
location ~* ^/(api/)?internal(/|$) { return 404; }

# Prefix isolation prevents any upload from reaching a PHP/CGI handler.
location ^~ /uploads/ {
    location ~* ^/uploads/(users/profile|karang_taruna/logos)/[a-z0-9_-]+\.(png|jpe?g|webp)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    return 404;
}
location ^~ /assets/ {
    location ~ (^|/)\. { return 404; }
    location ~* \.(css|js|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|eot)$ {
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    return 404;
}

# Only this fixed front controller can execute. PATH_INFO scripts are denied.
location = /index.php {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_hide_header X-Powered-By;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_connect_timeout 3s;
    fastcgi_read_timeout 35s;
}
location ~* \.(php[0-9]?|phtml|phar|cgi|pl|py|sh)(/|$) { return 404; }

location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kartar_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite untrusted forwarding headers. Configure CI/Node trusted proxies
    # only for the actual Nginx/Cloudflare topology after deployment review.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;
}
location = /favicon.ico { try_files $uri =404; }
location / { rewrite ^ /index.php last; }
